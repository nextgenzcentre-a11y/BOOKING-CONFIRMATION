<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Booking Confirmation Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#1c2333;--mute:#5d6678;--line:#e3e7ee;--navy:#1f2a44;--green:#1f7a50;--amber:#b7791f;--focus:#2b6cb0;--field:#f7f8fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--panel:#1a2030;--ink:#e8ecf4;--mute:#9aa4b8;--line:#2b3347;--field:#212a3d;--focus:#7fb2f0}}
:root[data-theme="dark"]{--bg:#12161f;--panel:#1a2030;--ink:#e8ecf4;--mute:#9aa4b8;--line:#2b3347;--field:#212a3d;--focus:#7fb2f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:20px;grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
h1{font-size:20px;margin:0 0 4px;color:var(--ink)}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
fieldset{border:0;margin:0 0 16px;padding:0;min-width:0}
legend{font-weight:700;font-size:14px;padding:0;margin-bottom:8px;color:var(--ink)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g .full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mute)}
input,select{width:100%;margin-top:3px;padding:9px 10px;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.btns{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--panel);padding-top:10px}
button{font:inherit;font-weight:700;padding:11px 16px;border-radius:7px;border:1px solid var(--navy);cursor:pointer}
#dl{background:var(--navy);color:#fff;flex:1}
#rs{background:transparent;color:var(--ink);border-color:var(--line)}
#msg{margin:10px 0 0;font-size:13px;min-height:18px;color:var(--mute)}
.sheet{background:#fff;color:#000;border:1px solid var(--line);border-radius:4px;padding:28px 26px 30px;font-family:Helvetica,Arial,sans-serif;font-size:13px;overflow-x:auto}
.sheet h2{margin:0;font-size:26px;color:#1f2a44}
.sheet .cd{color:#555;font-size:12px;margin:6px 0 16px}
.sheet .ban{background:var(--green);color:#fff;font-weight:700;text-align:center;padding:9px;font-size:14px;margin-bottom:12px}
.sheet h3{font-size:13px;color:#1f2a44;margin:16px 0 4px}
.sheet .r{display:grid;grid-template-columns:150px 1fr;padding:6px 0;border-bottom:1px solid #eceff3;gap:8px}
.sheet .r b{font-weight:700}
.sheet .fn{color:#555;font-size:10.5px;margin-top:22px;border-top:1px solid #eceff3;padding-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div>
<h1>Booking confirmation</h1>
<p class="sub">Fill in the guest and payment details. The preview updates as you type.</p>
<form id="f" autocomplete="off" onsubmit="return false">
<fieldset><legend>Guest</legend><div class="g">
<label class="full">Guest name<input id="guest" placeholder="MOINAFATMA SAID ABDALLAH"></label>
<label>Adults<input id="ad" type="number" min="0" value="2"></label>
<label>Children<input id="ch" type="number" min="0" value="0"></label>
<label>Infants<input id="inf" type="number" min="0" value="0"></label>
</div></fieldset>
<fieldset><legend>Stay</legend><div class="g">
<label>Property<input id="prop" value="Regalia Residences"></label>
<label>Unit no. / name<input id="unit" placeholder="REG B-21-10"></label>
<label>Check-in<input id="cin" type="date"></label>
<label>Check-out<input id="cout" type="date"></label>
<label>Booking reference<input id="ref" placeholder="GY-bhUaCL56"></label>
<label>Reservation confirmed<input id="rc" type="date"></label>
<label>Property invoice no.<input id="inv" placeholder="2815"></label>
<label>Issued by<input id="iss" value="Nai Hospitality (M) Sdn Bhd"></label>
</div></fieldset>
<fieldset><legend>Payment</legend><div class="g">
<label>Amount paid (RM)<input id="amt" inputmode="decimal" placeholder="575.70"></label>
<label>Balance due (RM)<input id="bal" inputmode="decimal" value="0.00"></label>
<label>Date paid<input id="dp" type="date"></label>
<label>Payment method<select id="pm"><option>Cash</option><option>Bank transfer</option><option>Credit / debit card</option><option>Online payment link</option><option>E-wallet / QR</option></select></label>
<label>Payment reference (optional)<input id="pr"></label>
<label>Receipt no. (optional)<input id="rn"></label>
<label class="full">Confirmation date<input id="cd" type="date"></label>
</div></fieldset>
<div class="btns"><button id="dl" type="button">Download PDF</button><button id="rs" type="button">Clear for next booking</button></div>
<p id="msg" role="status"></p>
</form>
</div>
<div><div class="sheet" id="pv" aria-label="Preview"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const IDS=['guest','ad','ch','inf','prop','unit','cin','cout','ref','rc','inv','iss','amt','bal','dp','pm','pr','rn','cd'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAY=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const fd=(s,wd)=>{const d=pd(s);return d?(wd?DAY[d.getDay()]+', ':'')+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear():''};
const money=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?'':'RM '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function data(){
 const v=Object.fromEntries(IDS.map(i=>[i,$(i).value.trim()]));
 const a=pd(v.cin),b=pd(v.cout);
 const n=a&&b?Math.round((b-a)/864e5):null;
 const bal=parseFloat(v.bal.replace(/,/g,''))||0;
 const inv=v.inv?('#'+v.inv.replace(/^#/,'')+(v.iss?' (issued by '+v.iss+')':'')):'';
 const sections=[
  ['Guest details',[['Guest name',v.guest],['Number of guests',v.ad+' Adults, '+v.ch+' Children, '+v.inf+' Infants']]],
  ['Stay details',[['Property',v.prop],['Unit no. / name',v.unit],['Check-in',fd(v.cin,1)],['Check-out',fd(v.cout,1)],['Length of stay',n===null?'':n+(n===1?' night':' nights')],['Booking reference',v.ref],['Reservation confirmed',fd(v.rc)],['Property invoice no.',inv]]],
  ['Payment details',[['Amount paid',money(v.amt),1],['Date paid',fd(v.dp)],['Payment method',v.pm],['Payment reference',v.pr],['Receipt no.',v.rn],['Balance due',money(v.bal||'0')]]]
 ].map(([t,rows])=>[t,rows.filter(r=>r[1])]);
 const paid=bal<=0;
 return {v,sections,paid,banner:'BOOKING CONFIRMED  \u2022  '+(paid?'PAID IN FULL':'BALANCE DUE'),
  note:paid?'This document confirms that the booking above has been reserved and that payment has been received in full. It is a booking confirmation only and does not replace the property\u2019s tax invoice, which remains the official record of the transaction.'
  :'This document confirms that the booking above has been reserved. The payment received so far and the balance still due are shown above. It is a booking confirmation only and does not replace the property\u2019s tax invoice, which remains the official record of the transaction.'};
}
function preview(){
 const d=data(),pv=$('pv');pv.textContent='';
 const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
 pv.append(el('h2','','Booking Confirmation'),el('div','cd','Confirmation date: '+fd(d.v.cd)));
 const ban=el('div','ban',d.banner.replace(/ {2}/g,' '));if(!d.paid)ban.style.background='var(--amber)';pv.append(ban);
 d.sections.forEach(([t,rows])=>{pv.append(el('h3','',t));rows.forEach(([l,val,bold])=>{const r=el('div','r');r.append(el('b','',l));const s=el('span','',val);if(bold)s.style.fontWeight='700';r.append(s);pv.append(r)})});
 pv.append(el('div','fn',d.note));
}
function makePdf(){
 const d=data(),{jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:'a4'});
 const X=62.7,V=218.6,L=56.7,R=538.6;
 doc.setFont('helvetica','bold').setFontSize(22).setTextColor(31,42,68).text('Booking Confirmation',X,62);
 doc.setFont('helvetica','normal').setFontSize(10).setTextColor(85).text('Confirmation date: '+fd(d.v.cd),X,87);
 doc.setFillColor(...(d.paid?[31,122,80]:[183,121,31])).rect(L,106,R-L,26,'F');
 doc.setFont('helvetica','bold').setFontSize(12).setTextColor(255).text(d.banner,(L+R)/2,123,{align:'center'});
 let y=158;
 d.sections.forEach(([t,rows])=>{
  doc.setFont('helvetica','bold').setFontSize(11).setTextColor(31,42,68).text(t,X,y);y+=23;
  rows.forEach(([l,val,bold])=>{
   doc.setFont('helvetica','bold').setFontSize(10).setTextColor(0).text(l,X,y);
   doc.setFont('helvetica',bold?'bold':'normal').text(val,V,y);
   doc.setDrawColor(230,233,238).setLineWidth(.6).line(L,y+7,R,y+7);y+=24;
  });y+=10;
 });
 doc.setFont('helvetica','normal').setFontSize(8.5).setTextColor(85);
 doc.text(doc.splitTextToSize(d.note,R-X),X,y+8);
 doc.setProperties({title:'Booking Confirmation '+d.v.ref});
 return doc.output('blob');
}
function say(t){$('msg').textContent=t}
$('dl').onclick=async()=>{
 const d=data();
 if(!d.v.guest||!d.v.cin||!d.v.cout||!d.v.ref||!d.v.amt){say('Fill in guest name, check-in, check-out, booking reference and amount paid first.');return}
 if(!window.jspdf){say('The PDF library did not load. Check your connection and reload.');return}
 try{
  const dls=await claude.use('downloads');
  if(!dls){say('Downloads are not available here. Open this artifact in claude.ai to save the PDF.');return}
  const r=await dls.save({filename:'Booking_Confirmation_'+d.v.ref.replace(/[^\w-]+/g,'_')+'.pdf',data:makePdf()});
  say(r.status==='saved'?'PDF saved.':'PDF sent.');
  try{['prop','iss','pm'].forEach(k=>localStorage.setItem('bc_'+k,$(k).value))}catch(e){}
 }catch(e){say(e&&e.code==='declined'?'Save cancelled.':'Could not save the PDF. Try again.')}
};
$('rs').onclick=()=>{['guest','unit','ref','inv','amt','pr','rn','cin','cout','dp','rc'].forEach(k=>$(k).value='');$('ad').value=2;$('ch').value=0;$('inf').value=0;$('bal').value='0.00';$('cd').value=iso(new Date());say('');preview()};
try{['prop','iss','pm'].forEach(k=>{const s=localStorage.getItem('bc_'+k);if(s)$(k).value=s})}catch(e){}
$('cd').value=iso(new Date());
IDS.forEach(i=>$(i).addEventListener('input',preview));
preview();
</script>
</body>
</html>
